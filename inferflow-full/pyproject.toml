[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inferflow"
version = "0.1.0"
description = "A lightweight LLM inference engine: tensor parallel, continuous batching, paged KV cache, prefix caching."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.9",
    "triton>=3.0; platform_system == 'Linux'",
    "transformers>=4.51",
    "safetensors",
    "xxhash",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
# FlashAttention 3 预编译包，需与 CUDA 版本匹配，推荐使用 scripts/setup_env.sh
cuda = ["flash-attn-3>=3.0.1"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["inferflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
